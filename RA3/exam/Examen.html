<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario simple</title>
    <link rel="stylesheet" href="Style.css">
    <script src="script.js"></script>
</head>

<body onload="preguntar()">
    <label>Mes:</label>
    <input type="text" id="mes" size="10" placeholder="Introduce mes">
    <label>Año:</label>
    <input type="text" id="año" size="10" placeholder="Introduce año">
    <br><br>
    <button onclick="validar()">Validar datos</button>
    <button onclick="ir()">Plantillas Calendarios</button>
    <div id="juego" style="display: none;">
        <button onclick="jugar()">Adivina el día</button> <input type="text" id="numero" size="4"
            onchange="comprobar()">
        <h4>Premio <span id="premio">300</span></h4>
    </div>
    <div id="errores"></div>
</body>

</html>

<!--El elemento de id premio contiene el número 300. Cada 3 segundos rebajar ese número
hasta llegar a 0 o hasta que el usuario adivine el número aleatorio generado. El usuario
puede teclear números en el input adivina hasta que se agote el dinero, cada vez que
cambia el número comprobar si es el correcto. Si lo acierta se le da la enhorabuena y se
deja de restar dinero.-->
