        let miCookie = document.cookie;

        let esta = miCookie.indexOf(busca);
        if (esta != -1) {
            ini = miCookie.indexOf("=", esta) + 1;

        function cacular() {
            let precioTotal = 0;
            let precio = 0;
            
        const campo1 = document.getElementById("#idtamaño");
            tamaño = campo1.value;
            if (tamaño == "Pequeña") {
                precio = 2;
            }
            else if (tamaño == "Mediana") {
                precio = 3;
            }
            else if (tamaño == "Grande") {
                precio = 4;
            }
            else if (tamaño == "Gigante") {
                precio = 5;
            }
            else {
                alert("debes selecionar un tamaño");
                campo1.focus();
                return;//ya que al haber un error detenemos la ejecucion
            }
            if (document.getElementById("idpatatas").checked)
                precioTotal = precio + 1;
            if (document.getElementById("idrefresco").checked)
                precioTotal = precio + 1.5;
            const cantidad = Calcantidad();
           if (cantidad === 0){
            return;
           }
           precioTotal=precioTotal *cantidad;
           document.getElementById("idtotal").value = precioTotal.toFixed(2) + "€";
           document.getElementById("premio").style.display = "block";
        }
        function Calcantidad() {
            // Utilizando getElementsByName
            var elementos = document.getElementsByName("cuantas");
            for (i = 0; i < elementos.length; i++)
                if (elementos[i].checked) {
                    document.getElementById("div1").innerHTML =
                        "<br>Nivel <br>" + elementos[i].value;
                    break;
                }
            if (i == elementos.length)
                alert("No ha seleccionado nada");
                return 0;

        }
        function verpremio(){
            const codigoPostal = document.getElementById("idcodigo").value.trim();
            const inputTotal = document.getElementById("idtotal");

            if(codigoPostal === "28001" || codigoPostal === "28002"){
                let precioActual = parseInt(InputTotal.value);

                if (!isNaN(precioActual)){
                    const precioDescuento = precioActual/2;
                     alert("su pedidio queda a mitad de precio");
                     inputTotal.value = precioDescuento.toFixed(2) + "€";
                     document.bgColor = "#90EE90";
                }
            }
            document.getElementById("premio").style.display = "none";
        }
    </script>
